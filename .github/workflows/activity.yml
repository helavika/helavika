name: Refresh activity card

on:
  schedule:
    - cron: "17 3 * * *"  # daily, 05:17 Kyiv time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/helavika-fonts
          key: helavika-fonts-v1
      - run: pip install fonttools
      - run: python3 scripts/build_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git diff --quiet -- assets/activity-*.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg
          git commit -m "Refresh activity card"
          git push
