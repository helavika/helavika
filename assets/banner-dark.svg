      .name { font-size: 62px; font-weight: 800; fill: #FFF1F8; letter-spacing: -1px; }
      .role { font-size: 26px; font-weight: 600; fill: #CDBDEB; }
      .label { font-size: 21px; font-weight: 800; }
      .glyph { font-size: 28px; font-weight: 700; }
      .cap { animation: press 3.6s ease-out infinite; }
      @keyframes press { 0%, 14%, 100% { transform: translateY(0); } 4%, 7% { transform: translateY(12px); } }
      .burst { opacity: 0; animation: burst 3.6s ease-out infinite; }
      @keyframes burst { 0%, 3% { opacity: 0; transform: translateY(6px); } 6% { opacity: 1; transform: translateY(0); } 16%, 100% { opacity: 0; transform: translateY(-8px); } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .burst { opacity: 0; } }
    </style>
  </defs>

