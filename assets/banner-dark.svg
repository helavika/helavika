<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Viktoria Shchypalkina — Front-End &amp; Marketing Technology Engineer. Referral programs · A/B testing · Apple &amp; Google Wallet · AI agents">
