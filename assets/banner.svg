<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Viktoria Shchypalkina — Front-End &amp; Marketing Technology Engineer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1d1636"/>
      <stop offset="0.6" stop-color="#43295f"/>
      <stop offset="1" stop-color="#7d4672"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb3d4"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#8fd3ff"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="0.15" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".24"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="28"/></clipPath>
    <clipPath id="jarInside"><path d="M1006 120 v14 q0 10 -22 16 q-14 4 -14 22 v118 q0 22 22 22 h112 q22 0 22 -22 v-118 q0 -18 -14 -22 q-22 -6 -22 -16 v-14 z"/></clipPath>
    <style>
      text { font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; }
      .hi { font-size: 26px; font-weight: 600; fill: #ffd6e8; letter-spacing: 1px; }
      .name { font-size: 76px; font-weight: 900; letter-spacing: -2px; }
      .tag { font-size: 26px; font-weight: 600; fill: #f3e7ff; }
      .tag b { font-weight: 800; }
      .pill text { font-size: 18px; font-weight: 800; fill: #2a1d45; }
      .blob { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .b2 { animation-duration: 18s; animation-delay: -5s; }
      .b3 { animation-duration: 22s; animation-delay: -9s; }
      @keyframes drift { from { transform: translate(-40px, 20px) scale(1); } to { transform: translate(60px, -30px) scale(1.25); } }
      .bob { animation: bob 3.2s ease-in-out infinite; }
      .d1 { animation-delay: -.8s; } .d2 { animation-delay: -1.6s; } .d3 { animation-delay: -2.4s; }
      @keyframes bob { 50% { transform: translateY(-7px); } }
      .wave { animation: wave 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 70% 80%; }
      @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(16deg); } 20%, 40% { transform: rotate(-8deg); } }
      .tw { animation: tw 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .t2 { animation-delay: -.9s; } .t3 { animation-delay: -1.7s; }
      @keyframes tw { 0%, 100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
      .grain { animation: fall 1.6s linear infinite; }
      .g2 { animation-delay: -.4s; } .g3 { animation-delay: -.8s; } .g4 { animation-delay: -1.2s; }
      @keyframes fall { from { transform: translateY(-40px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateY(120px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#sky)"/>
    <circle class="blob" cx="260" cy="320" r="170" fill="#f5a3c7" opacity=".45" filter="url(#blur)"/>
    <circle class="blob b2" cx="760" cy="60" r="150" fill="#b9a2ff" opacity=".45" filter="url(#blur)"/>
    <circle class="blob b3" cx="1080" cy="330" r="160" fill="#8fd3ff" opacity=".35" filter="url(#blur)"/>

    <!-- sparkles -->
    <g fill="#fff" filter="url(#glow)">
      <path class="tw" d="M640 70 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z"/>
      <path class="tw t2" d="M905 46 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
      <path class="tw t3" d="M560 330 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
      <path class="tw t2" d="M1150 120 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
      <path class="tw" d="M78 46 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    </g>

    <!-- name and role -->
    <text class="name" x="64" y="160" fill="url(#name)">Viktoria Shchypalkina</text>
    <text class="tag" x="70" y="210">Front-End &amp; Marketing Technology Engineer</text>

    <!-- stickers -->
    <g transform="translate(70 262)"><g class="pill bob">
      <g transform="rotate(-4)"><rect width="190" height="44" rx="22" fill="#ffb3d4"/><text x="95" y="28" text-anchor="middle">Referral programs</text></g>
    </g></g>
    <g transform="translate(276 266)"><g class="pill bob d1">
      <g transform="rotate(3)"><rect width="140" height="44" rx="22" fill="#c9b8ff"/><text x="70" y="28" text-anchor="middle">A/B testing</text></g>
    </g></g>
    <g transform="translate(432 260)"><g class="pill bob d2">
      <g transform="rotate(-2)"><rect width="230" height="44" rx="22" fill="#8fd3ff"/><text x="115" y="28" text-anchor="middle">Apple &amp; Google Wallet</text></g>
    </g></g>
    <g transform="translate(678 266)"><g class="pill bob d3">
      <g transform="rotate(4)"><rect width="130" height="44" rx="22" fill="#ffe3a8"/><text x="65" y="28" text-anchor="middle">AI agents</text></g>
    </g></g>

    <!-- pixel sand jar -->
    <g transform="translate(0 6)">
      <ellipse cx="1040" cy="318" rx="86" ry="10" fill="#0a0019" opacity=".35"/>
      <g clip-path="url(#jarInside)">
        <path d="M960 312 L960 262 L1000 236 L1040 254 L1080 232 L1120 258 L1120 312 Z" fill="#9fd8cb"/>
        <path d="M960 262 L1000 236 L1040 254 L1080 232 L1120 258 L1120 240 L1080 210 L1040 230 L1000 212 L960 238 Z" fill="#ffb3d4"/>
        <path d="M960 238 L1000 212 L1040 230 L1080 210 L1120 240 L1120 224 L1080 196 L1040 214 L1000 198 L960 218 Z" fill="#fde7a4"/>
        <g fill="#fff" opacity=".55">
          <rect x="978" y="270" width="3" height="3"/><rect x="1030" y="282" width="3" height="3"/><rect x="1092" y="268" width="3" height="3"/>
          <rect x="1010" y="246" width="3" height="3"/><rect x="1064" y="236" width="3" height="3"/><rect x="1100" y="224" width="3" height="3"/>
        </g>
        <g fill="#ffd6e8">
          <rect class="grain" x="1032" y="110" width="4" height="4"/>
          <rect class="grain g2" x="1044" y="110" width="4" height="4" fill="#c9b8ff"/>
          <rect class="grain g3" x="1038" y="110" width="4" height="4" fill="#8fd3ff"/>
          <rect class="grain g4" x="1050" y="110" width="4" height="4" fill="#ffe3a8"/>
        </g>
      </g>
      <path d="M1006 120 v14 q0 10 -22 16 q-14 4 -14 22 v118 q0 22 22 22 h112 q22 0 22 -22 v-118 q0 -18 -14 -22 q-22 -6 -22 -16 v-14 z" fill="url(#glass)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
      <rect x="982" y="182" width="8" height="98" rx="4" fill="#fff" opacity=".5"/>
      <rect x="1094" y="196" width="4" height="50" rx="2" fill="#fff" opacity=".3"/>
      <ellipse cx="1040" cy="120" rx="36" ry="5" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".8" stroke-width="1.6"/>
    </g>
  </g>
</svg>
